<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Ajouter dans le head -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Animation Faciale 3D - Three.js + MediaPipe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <canvas id="output"></canvas>
        <video id="webcam" autoplay playsinline muted style="display: none;"></video>
        
        <div id="ui">
            <div class="panel">
                <h1>🎭 Animation Faciale 3D</h1>
                <div class="status-grid">
                    <div class="status-item">
                        <span class="label">Modèle</span>
                        <span id="modelName" class="value">Chargement...</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Blendshapes</span>
                        <span id="blendshapeCount" class="value">0</span>
                    </div>
                    <div class="status-item">
                        <span class="label">MediaPipe</span>
                        <span id="mediapipeStatus" class="value status-inactive">Inactif</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Caméra</span>
                        <span id="cameraStatus" class="value status-inactive">Inactive</span>
                    </div>
                    <div class="status-item">
                        <span class="label">FPS</span>
                        <span id="fps" class="value">0</span>
                    </div>
                </div>
                <div class="controls">
                    <button id="startBtn" class="btn btn-start">🎥 Activer caméra</button>
                    <button id="stopBtn" class="btn btn-stop" disabled>⏹️ Désactiver caméra</button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
